services:
  - type: web
    name: food-craft
    env: node
    plan: free
    buildCommand: pip install -r requirements-render.txt && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: HF_VISION_MODEL_ID
        value: pavankumarpalla/FoodCraft-Llama-3.2-11B-Vision
      - key: HF_VISION_LORA_ID
        value: pavankumarpalla/FoodCraft-Llama-3.2-11B-Vision-LoRA
      - key: HF_VISION_INFERENCE_URL
        value: https://pavankumarpalla-foodcraft-vision-api.hf.space
      - key: HF_TOKEN
        sync: false
